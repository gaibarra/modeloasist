map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=asistenciamodelo_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=asistenciamodelo_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name asistenciamodelo.online;

    access_log /var/log/nginx/asistenciamodelo.access.log;
    error_log /var/log/nginx/asistenciamodelo.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/asistenciamodelo-certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asistenciamodelo.online;

    access_log /var/log/nginx/asistenciamodelo.access.log;
    error_log /var/log/nginx/asistenciamodelo.error.log;

    ssl_certificate /etc/letsencrypt/live/asistenciamodelo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asistenciamodelo.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        limit_req zone=asistenciamodelo_per_ip burst=30 nodelay;
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location = /api/auth/login {
        limit_req zone=asistenciamodelo_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location = /backend-health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8184/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
