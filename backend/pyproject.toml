[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "asistencia-backend"
version = "0.1.0"
description = "AI-assisted attendance analytics service"
authors = [{ name = "Equipo Modelo Asist" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "SQLAlchemy>=2.0.32,<2.1.0",
    "psycopg[binary]>=3.2.1,<3.3.0",
    "pydantic>=2.7.4,<2.8.0",
    "pydantic-settings>=2.4.0,<2.5.0",
    "alembic>=1.13.2,<1.14.0",
    "python-dotenv>=1.0.1,<1.1.0",
    "httpx>=0.27.0,<0.28.0",
    "google-cloud-aiplatform>=1.70.0,<1.71.0",
    "email-validator>=2.2.0,<3.0.0",
    "structlog>=24.2.0,<24.3.0",
    "python-multipart>=0.0.9,<0.0.10",
    "openpyxl>=3.1.5,<3.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<8.4.0",
    "pytest-asyncio>=0.23.7,<0.24.0",
    "ruff>=0.5.6,<0.6.0",
    "mypy>=1.11.0,<1.12.0"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
